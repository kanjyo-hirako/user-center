# 线上配置文件
spring:
  # DataSource Config — 通过环境变量注入（Render 部署时配置）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  # session 失效时间
  session:
    timeout: 86400
server:
  address: 0.0.0.0